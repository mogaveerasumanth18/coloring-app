// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
    // Fallback repositories for when primary repositories are unavailable
    maven {
      url 'https://maven.google.com/'
      name 'Google'
    }
  }
  dependencies {
    // Specify explicit version for Android Gradle Plugin to avoid version conflicts
    classpath('com.android.tools.build:gradle:8.5.0')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.24')
  }
}

def reactNativeAndroidDir = new File(
  providers.exec {
    workingDir(rootDir)
    commandLine("node", "--print", "require.resolve('react-native/package.json')")
  }.standardOutput.asText.get().trim(),
  "../android"
)

allprojects {
  repositories {
    maven {
      // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
      url(reactNativeAndroidDir)
    }

    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
    
    // Additional fallback repositories for dependency resolution
    maven {
      url 'https://maven.google.com/'
      name 'Google'
    }
    
    // Fallback for Android tools when primary repository is unavailable
    maven {
      url 'https://repo1.maven.org/maven2/'
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
